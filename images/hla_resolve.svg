<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .helix { stroke: #4A90B8; stroke-width: 7; fill: none; stroke-linecap: round; }
      .rung  { stroke: #4A90B8; stroke-width: 4; stroke-linecap: round; }
      .bond  { stroke: #6B7A85; stroke-width: 2.5; stroke-linecap: round; }
      .atomO { fill: #E89A6B; }
      .atomT { fill: #4A90B8; }
      .label { fill: #6B7A85; font-size: 22px; font-weight: 700; }
      .sub   { fill: #6B7A85; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <!-- ===== DNA double helix (center) — two crossing sine strands ===== -->
  <g transform="translate(300 160)">
    <!-- strand A: smooth sine-wave bezier approximation -->
    <path class="helix" d="
      M -40,-130
      C -40,-103  40,-77   40,-50
      C  40,-23  -40, 3   -40, 30
      C -40, 57   40, 83   40,110
      L  40,130"/>
    <!-- strand B: mirror -->
    <path class="helix" d="
      M  40,-130
      C  40,-103 -40,-77  -40,-50
      C -40,-23   40, 3    40, 30
      C  40, 57  -40, 83  -40,110
      L -40,130"/>
    <!-- horizontal base-pair rungs at the wide points -->
    <!-- rungs in the wide sections only -->
    <line class="rung" x1="-34" y1="-72"  x2="34" y2="-72"/>
    <line class="rung" x1="-38" y1="-58"  x2="38" y2="-58"/>
    <line class="rung" x1="-34" y1="-44"  x2="34" y2="-44"/>

    <line class="rung" x1="-34" y1="8"    x2="34" y2="8"/>
    <line class="rung" x1="-38" y1="22"   x2="38" y2="22"/>
    <line class="rung" x1="-34" y1="36"   x2="34" y2="36"/>

    <line class="rung" x1="-34" y1="88"   x2="34" y2="88"/>
    <line class="rung" x1="-38" y1="102"  x2="38" y2="102"/>
    <line class="rung" x1="-34" y1="116"  x2="34" y2="116"/>
  </g>

  <!-- ===== Left molecule cluster (branched chain) ===== -->
  <g>
    <line class="bond" x1="70"  y1="90"  x2="125" y2="120"/>
    <line class="bond" x1="125" y1="120" x2="185" y2="100"/>
    <line class="bond" x1="125" y1="120" x2="150" y2="180"/>
    <line class="bond" x1="150" y1="180" x2="90"  y2="210"/>
    <line class="bond" x1="150" y1="180" x2="210" y2="200"/>
    <line class="bond" x1="90"  y1="210" x2="55"  y2="170"/>

    <circle class="atomO" cx="70"  cy="90"  r="13"/>
    <circle class="atomT" cx="125" cy="120" r="12"/>
    <circle class="atomO" cx="185" cy="100" r="12"/>
    <circle class="atomT" cx="150" cy="180" r="13"/>
    <circle class="atomO" cx="90"  cy="210" r="12"/>
    <circle class="atomT" cx="55"  cy="170" r="10"/>
    <circle class="atomO" cx="210" cy="200" r="11"/>

    <text class="label" x="18" y="135">H</text>
    <text class="sub"   x="34" y="143">2</text>
  </g>

  <!-- ===== Right molecule cluster ===== -->
  <g>
    <line class="bond" x1="530" y1="90"  x2="475" y2="120"/>
    <line class="bond" x1="475" y1="120" x2="415" y2="100"/>
    <line class="bond" x1="475" y1="120" x2="450" y2="180"/>
    <line class="bond" x1="450" y1="180" x2="510" y2="210"/>
    <line class="bond" x1="450" y1="180" x2="390" y2="200"/>
    <line class="bond" x1="510" y1="210" x2="545" y2="170"/>

    <circle class="atomT" cx="530" cy="90"  r="13"/>
    <circle class="atomO" cx="475" cy="120" r="12"/>
    <circle class="atomT" cx="415" cy="100" r="12"/>
    <circle class="atomO" cx="450" cy="180" r="13"/>
    <circle class="atomT" cx="510" cy="210" r="12"/>
    <circle class="atomO" cx="545" cy="170" r="10"/>
    <circle class="atomT" cx="390" cy="200" r="11"/>

    <text class="label" x="560" y="135">H</text>
    <text class="sub"   x="576" y="143">2</text>
  </g>
</svg>
